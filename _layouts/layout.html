<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} · {{ site.role }}{% endif %}</title>
    <meta name="description" content="{{ site.description | strip_newlines }}">
    <meta name="author" content="{{ site.author }}">
    <link rel="canonical" href="{{ site.url }}">

    <meta property="og:type" content="profile">
    <meta property="og:title" content="{{ site.title }} · {{ site.role }}">
    <meta property="og:description" content="{{ site.description | strip_newlines }}">
    <meta property="og:url" content="{{ site.url }}">
    <meta property="og:image" content="{{ site.url }}/static/img/{{ site.avatar }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ site.title }} · {{ site.role }}">
    <meta name="twitter:description" content="{{ site.description | strip_newlines }}">
    <meta name="twitter:image" content="{{ site.url }}/static/img/{{ site.avatar }}">

    <meta name="theme-color" content="#0c0c0e">

    <link rel="icon" href="{{ site.baseurl }}static/img/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="{{ site.baseurl }}static/img/apple-touch-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ site.baseurl }}static/css/main.css">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "{{ site.author }}",
      "jobTitle": "{{ site.role }}",
      "worksFor": { "@type": "Organization", "name": "{{ site.company }}" },
      "address": { "@type": "PostalAddress", "addressLocality": "{{ site.location }}" },
      "url": "{{ site.url }}",
      "image": "{{ site.url }}/static/img/{{ site.avatar }}",
      "email": "mailto:{{ site.email }}",
      "sameAs": [
        "https://www.linkedin.com/in/{{ site.linkedin }}",
        "https://scholar.google.com/citations?user={{ site.google_scholar }}",
        "https://github.com/{{ site.github }}"
      ]
    }
    </script>

    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          document.documentElement.dataset.theme = stored === 'light' ? 'light' : 'dark';
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <button class="theme-toggle" type="button" aria-label="Switch colour theme" title="Switch colour theme">
      <svg class="theme-toggle__sun" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 17a5 5 0 1 1 0-10 5 5 0 0 1 0 10Zm0-2a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm-1-13h2v3h-2V2Zm0 17h2v3h-2v-3ZM2 11h3v2H2v-2Zm17 0h3v2h-3v-2ZM4.2 5.6l1.4-1.4 2.1 2.1-1.4 1.4-2.1-2.1Zm12.1 12.1 1.4-1.4 2.1 2.1-1.4 1.4-2.1-2.1Zm2.1-13.5 1.4 1.4-2.1 2.1-1.4-1.4 2.1-2.1ZM5.6 19.8 4.2 18.4l2.1-2.1 1.4 1.4-2.1 2.1Z"/></svg>
      <svg class="theme-toggle__moon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21.6 13.3A9 9 0 0 1 10.7 2.4a9 9 0 1 0 10.9 10.9Z"/></svg>
    </button>

    <main class="page">
      {{ content }}
    </main>

    <script src="{{ site.baseurl }}static/js/main.js" defer></script>
    {% include analytics.html %}
  </body>
</html>
