<script>
(async function () {
  var locked = document.getElementById("locked");
  function showLocked() { locked.hidden = false; }
  function bytes(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    var b = atob(s), a = new Uint8Array(b.length);
    for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i);
    return a;
  }
  try {
    var k = location.hash.slice(1).split("/")[0];
    if (!k || !window.crypto || !crypto.subtle) { showLocked(); return; }
    var data = bytes(document.getElementById("payload").textContent.trim());
    var key = await crypto.subtle.importKey("raw", bytes(k), "AES-GCM", false, ["decrypt"]);
    var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: data.slice(0, 12) }, key, data.slice(12));
    var html = new TextDecoder().decode(plain);
    // swap in the invitation as a fresh document so nothing from this page lingers
    var doc = new DOMParser().parseFromString(html, "text/html");
    var fresh = document.adoptNode(doc.documentElement);
    document.replaceChild(fresh, document.documentElement);
    var scripts = fresh.querySelectorAll("script");
    for (var i = 0; i < scripts.length; i++) {
      var old = scripts[i], s = document.createElement("script");
      for (var j = 0; j < old.attributes.length; j++) s.setAttribute(old.attributes[j].name, old.attributes[j].value);
      s.textContent = old.textContent;
      old.parentNode.replaceChild(s, old);
    }
  } catch (err) {
    showLocked();
  }
})();
</script>
